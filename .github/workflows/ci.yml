# Professional PR quality gates: rustfmt, clippy (warnings-as-errors), tests, and
# a coverage measurement. Runs on every PR to main (and pushes to main). See CLAUDE.md §2.
#
# Coverage is BLOCKING at the CLAUDE.md §2.3 floor of 80%.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest run --workspace (flaky-aware, retries=2)
        # nextest retries a failing test up to 2x and reports failed-then-passed
        # tests as "flaky" in its summary — surfaces flake without hiding it.
        run: cargo nextest run --workspace --all-features --retries 2

      - name: cargo nextest run --workspace --release
        # This crate's contract is that two independent implementations compute identical
        # integers. Arithmetic that panics in debug can return a wrong value in release —
        # the exact defect found in review round 1 (saturation_micros panicked in debug and
        # returned 4611686018427387903 in release). A debug-only suite cannot see that class,
        # so the suite runs under both profiles.
        run: cargo nextest run --workspace --all-features --retries 2 --release

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage (gate at 80%)
        run: cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines 80
